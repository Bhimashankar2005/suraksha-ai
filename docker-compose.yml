version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: suraksha-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: suraksha_db
      POSTGRES_USER: suraksha_user
      POSTGRES_PASSWORD: suraksha_secure_password_2026
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U suraksha_user -d suraksha_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: suraksha-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://suraksha_user:suraksha_secure_password_2026@db:5432/suraksha_db
      ENVIRONMENT: production
      SECRET_KEY: suraksha-super-secret-key-change-in-production
      CORS_ORIGINS: '["http://localhost:3000"]'
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./storage:/app/storage

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: suraksha-frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:

